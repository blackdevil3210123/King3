    <script>
        // Toggle response body
        function toggleResponse(card) {
            const body = card.querySelector('.response-body');
            const arrow = card.querySelector('.arrow');
            if (body) {
                body.classList.toggle('active');
                if (arrow) {
                    arrow.classList.toggle('rotated');
                }
            }
        }
        
        // Form submission loader
        document.getElementById('bombForm')?.addEventListener('submit', function(e) {
            const btn = document.getElementById('bombBtn');
            if (btn) {
                btn.innerHTML = '<span class="loader"></span> Processing...';
                btn.disabled = true;
            }
        });
        
        // Auto-expand results on load
        document.addEventListener('DOMContentLoaded', function() {
            const resultCards = document.querySelectorAll('.result-card');
            resultCards.forEach((card, index) => {
                if (index < 3) { // Auto expand first 3 results
                    const body = card.querySelector('.response-body');
                    const arrow = card.querySelector('.arrow');
                    if (body && body.innerHTML.trim()) {
                        body.classList.add('active');
                        if (arrow) arrow.classList.add('rotated');
                    }
                }
            });
        });
    </script>
